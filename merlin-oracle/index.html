<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090a12">
  <title>Merlin Oracle | Your Private Almanac of Time</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="starfield" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar">
    <button class="brand" data-view="oracle" aria-label="Return to the Oracle">
      <span class="brand-mark">M</span>
      <span><strong>MERLIN</strong><small>ORACLE</small></span>
    </button>
    <div class="topbar-status"><span class="status-dot"></span> LOCAL MACHINE <span class="divider">/</span> ARCHIVE ONLINE</div>
    <button class="icon-button" data-action="toggle-manual" title="Open instrument notes" aria-label="Open instrument notes">?</button>
  </header>

  <main id="app" class="app-shell"></main>

  <div id="modal-root"></div>
  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
